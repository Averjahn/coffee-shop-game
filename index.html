<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Кофейня — симулятор бариста</title>
<meta name="description" content="Симулятор работы бариста: настоящая эспрессо-машина, помол, темпер, пролив и взбивание молока. Мини-игры на добавки — зефир, сиропы, топпинги.">
<meta name="theme-color" content="#F6EDE3">
<style>
:root{
  --cream:#F8F0E7; --cream2:#F0E3D5; --milk:#FFFBF6;
  --crema:#C98A4B; --crema2:#E0A867; --bean:#4A3229; --bean2:#6B4A3A;
  --mint:#7CC5B0; --mint2:#5FB49C;
  --berry:#E8807F; --sun:#F5C86B; --grape:#B49AD1;
  --ink:#3B2A22; --dim:#8A7266; --line:#E4D3C2;
  --ok:#5CB87F; --bad:#E27373;
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--cream);color:var(--ink);
  font:16px/1.5 'Nunito','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
canvas{display:block;touch-action:none}

#app{max-width:480px;margin:0 auto;height:100dvh;height:100vh;
  display:flex;flex-direction:column;position:relative;
  background:var(--cream);box-shadow:0 0 50px rgba(74,50,41,.12)}

/* ---------- верхняя панель ---------- */
.hud{display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:var(--milk);border-bottom:2px solid var(--line);flex:none;z-index:20}
.coin{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;
  background:var(--cream2);padding:6px 12px;border-radius:999px}
.coin small{font-weight:700;color:var(--dim);font-size:12px}
.hud .day{margin-left:auto;font-size:12.5px;color:var(--dim);font-weight:700;text-align:right;line-height:1.25}
.hud .day b{display:block;color:var(--ink);font-size:14px}

/* ---------- экраны ---------- */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;display:none;padding-bottom:78px}
.screen.on{display:block}
.pad{padding:16px}

h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:14px}

.card{background:var(--milk);border:2px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 22px;border-radius:16px;font-weight:800;font-size:15px;
  background:var(--cream2);border-bottom:4px solid rgba(74,50,41,.16);
  transition:transform .08s,filter .15s}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.p{background:var(--crema);color:#fff;border-bottom-color:#A66E37}
.btn.m{background:var(--mint);color:#fff;border-bottom-color:#4A9C86}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- нижние вкладки ---------- */
.tabs{position:absolute;bottom:0;left:0;right:0;height:66px;display:flex;
  background:var(--milk);border-top:2px solid var(--line);z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--dim);font-size:10.5px;font-weight:800}
.tab .ic{width:24px;height:24px;display:block}
.tab.on{color:var(--crema)}
.tab .badge{position:absolute;top:8px;margin-left:26px;background:var(--berry);color:#fff;
  font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;font-weight:800;padding:0 4px}

/* ---------- зал: сцена кофейни ---------- */
.shopScene{position:relative;background:#F3E3D1;border-bottom:3px solid var(--line)}
.shopScene canvas{width:100%;display:block;cursor:pointer}
.pickCard{background:var(--milk);border:2px solid var(--crema);border-radius:var(--r);
  padding:14px;display:flex;gap:12px;align-items:center;animation:pop .25s ease}
.pickCard .who{flex:1;min-width:0}
.pickCard .nm{font-weight:800;font-size:15px}
.pickCard .ord{font-size:13.5px;color:var(--dim);margin-top:2px}
.pickCard .ex{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.hintLine{text-align:center;color:var(--dim);font-size:13.5px;padding:6px 4px}

/* ---------- зал: гости ---------- */
.guest{display:flex;gap:12px;align-items:flex-start;background:var(--milk);
  border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;
  animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.guest.serving{border-color:var(--crema);background:#FFF7EE}
.face{width:52px;height:52px;border-radius:50%;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:27px;background:var(--cream2)}
.guest .info{flex:1;min-width:0}
.guest .nm{font-weight:800;font-size:15px}
.guest .order{font-size:13.5px;color:var(--dim);margin-top:2px}
.guest .extras{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--cream2)}
.chip.need{background:#FFE9C9;color:#8A5A00}
.chip.have{background:#DFF3E6;color:#2F7A4E}
.patience{height:6px;background:var(--cream2);border-radius:3px;overflow:hidden;margin-top:9px}
.patience i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s linear}
.patience.mid i{background:var(--sun)}
.patience.low i{background:var(--bad)}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}
.empty .big{width:52px;height:52px;margin:0 auto 10px;display:block}

/* ---------- станция бариста ---------- */
.taskLine{background:var(--crema);color:#fff;border-radius:12px;padding:9px 14px;
  font-size:13.5px;font-weight:800;text-align:center;margin-bottom:10px;line-height:1.35}
.taskLine:empty, .steps:empty, .card:empty{display:none}
.taskLine small{display:block;font-weight:700;opacity:.85;font-size:11.5px;margin-top:2px}

.rig{margin-bottom:10px}
#station{width:100%;height:auto;display:block;touch-action:none;overflow:visible}
#station text{font-family:'Nunito',sans-serif}
.svgCap{font-size:9px;font-weight:800;fill:#8A7266;letter-spacing:.06em}
.svgCapB{font-size:9.5px;font-weight:800;fill:#C98A4B}
.svgBrand{font-size:13px;font-weight:900;fill:#EDF2F5;letter-spacing:.16em;opacity:.9}
.svgGauge{font-size:8px;font-weight:800;fill:#C9D4DB}

/* Пар. Клубы поднимаются, растут и тают — три штуки со сдвигом фазы,
   чтобы струя выглядела живой, а не пульсировала синхронно. */
#steamPuffs .puff ellipse{fill:#FFFFFF;opacity:.75}
#station.steaming #steamPuffs{opacity:1}
#station.steaming .puff{animation:puff 1.5s ease-out infinite}
#station.steaming .p2{animation-delay:.5s}
#station.steaming .p3{animation-delay:1s}
@keyframes puff{
  0%  {transform:translateY(0) scale(.35);opacity:.85}
  60% {opacity:.5}
  100%{transform:translateY(-46px) scale(1.5);opacity:0}
}
#station.hot #cupSteam{opacity:.55}
#station.hot .curl{animation:curl 2.4s ease-in-out infinite;transform-origin:bottom}
#station.hot .c2{animation-delay:.6s}
#station.hot .c3{animation-delay:1.2s}
@keyframes curl{
  0%  {opacity:0;transform:translateY(6px) scaleY(.7)}
  35% {opacity:.6}
  100%{opacity:0;transform:translateY(-16px) scaleY(1.15)}
}
@media (prefers-reduced-motion: reduce){
  #station.steaming .puff, #station.hot .curl{animation:none}
}

#grinder{transition:transform .08s}
#grinder.on{transform:translateY(2px)}
#leverArm{transform-origin:131px 92px;transition:transform .14s cubic-bezier(.4,1.3,.5,1)}
#lever.pulled #leverArm{transform:rotate(52deg)}
#valveMark{transform-origin:352px 88px}
.groupArea.drop rect:first-child{stroke:#C98A4B;stroke-width:3}

.flushBtn .bIc{width:19px;height:19px;vertical-align:-4px;margin-right:7px}
.flushBtn{display:block;width:100%;margin-top:8px;background:#39434B;color:#CFE8F0;
  border-radius:12px;padding:11px;font-size:12.5px;font-weight:800;border-bottom:3px solid #2C343A}
.flushBtn:active{transform:translateY(2px);border-bottom-width:1px}
.flushBtn.done{background:#2F6E5E;color:#DFF6EE}

/* рожок и темпер живут внутри SVG — им нужен только курсор и плавность */
#pf, #tamper{transition:opacity .2s}
#station{touch-action:none}
#pfDock, .tamperBox, .rig .cap, .dockCap{display:none}

/* шаги *//* шаги *//* шаги *//* шаги */
.steps{display:flex;gap:5px;margin-bottom:10px}
.stp{flex:1;text-align:center;font-size:10px;font-weight:800;color:var(--dim);
  padding:7px 2px;border-radius:10px;background:var(--cream2);line-height:1.3}
.stp.on{background:var(--crema);color:#fff}
.stp.done{background:var(--ok);color:#fff}

/* слайдер помола */
.grindRow{display:flex;align-items:center;gap:10px;margin-top:8px}
.grindRow input{flex:1;accent-color:var(--crema);height:24px}
.tag{font-size:11px;font-weight:800;color:var(--dim);white-space:nowrap}

/* индикатор дозы/темпа */
.meter{height:26px;background:var(--cream2);border-radius:13px;overflow:hidden;position:relative;margin-top:8px}
.meter i{display:block;height:100%;background:var(--crema);transition:width .05s linear}
.meter .zone{position:absolute;top:0;bottom:0;background:rgba(92,184,127,.35);
  border-left:2px dashed var(--ok);border-right:2px dashed var(--ok)}
.meter .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--ink)}

/* результат */
.verdict{text-align:center;padding:18px}
.verdict .big{width:56px;height:56px;margin:0 auto 6px;display:block}
.verdict h3{font-size:22px;font-weight:900;margin-bottom:6px}
.verdict p{color:var(--dim);font-size:14px;margin-bottom:4px}
.stars{display:flex;justify-content:center;gap:3px;margin:8px 0}

/* ---------- магазин ---------- */
.shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--milk);border:2px solid var(--line);border-radius:var(--r);
  padding:14px;text-align:center}
.item .em{line-height:0}
.item .nm{font-weight:800;font-size:13.5px;margin:7px 0 2px}
.item .cnt{font-size:11.5px;color:var(--dim);margin-bottom:9px}
.item .buy{width:100%;padding:9px;border-radius:12px;background:var(--cream2);
  font-weight:800;font-size:12.5px;border-bottom:3px solid rgba(74,50,41,.15)}
.item .buy:disabled{opacity:.4}

/* ---------- мини-игра ---------- */
.mgWrap{position:fixed;inset:0;background:rgba(59,42,34,.55);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:12px;
  opacity:0;visibility:hidden;transition:.2s}
.mgWrap.on{opacity:1;visibility:visible}
.mgBox{background:var(--milk);border-radius:22px;width:min(430px,100%);overflow:hidden;
  border:3px solid var(--line)}
.mgTop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  background:var(--cream2)}
.mgTop b{font-size:15px}
.mgTop .sc{font-weight:900;color:var(--crema)}
.mgTop button{font-size:22px;line-height:1;color:var(--dim)}
#mgCanvas{width:100%;background:linear-gradient(180deg,#FFF6EA,#FBE8D4)}
.mgFoot{padding:11px 16px;font-size:12.5px;color:var(--dim);text-align:center}
.mgOver{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:rgba(255,251,246,.94);padding:20px;text-align:center}
.mgOver.hide{display:none}
.mgOver .big{width:54px;height:54px;margin:0 auto 8px;display:block}
.jStages{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:6px}
.jSt{font-size:10.5px;font-weight:800;color:var(--dim);background:var(--cream2);
  padding:6px 8px;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px}
.jSt .e{width:17px;height:17px;vertical-align:-3px}
.jArr{color:var(--dim2);font-size:11px}
.jFact{background:var(--cream2);border-radius:12px;padding:12px 14px;font-size:12.5px;
  color:var(--ink);line-height:1.5;margin:4px 0 16px;max-width:34ch;text-align:left}
.jTable{width:100%;max-width:300px;margin:6px 0}
.jRow{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;
  border-bottom:1px solid var(--line);color:var(--dim)}
.jRow b{color:var(--ink)}
.jRow.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;
  padding-top:9px;font-weight:800;color:var(--ink);font-size:15px}
.mgOver h3{font-size:20px;font-weight:900;margin-bottom:6px}
.mgOver p{color:var(--dim);font-size:14px;margin-bottom:16px;max-width:30ch}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:70;
  background:var(--bean);color:#fff;padding:11px 18px;border-radius:14px;
  font-size:13.5px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;
  max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}

@media(max-height:670px){
  .cupZone{height:62px}.cupImg{width:64px;height:55px}
  .machine{padding:12px}
}
</style>
</head>
<body>
<div id="app">

  <div class="hud">
    <div class="coin"><img id="icMoney" alt="" width="17" height="17"> <span id="money">0</span> <small>₽</small></div>
    <div class="coin"><img id="icStar" alt="" width="17" height="17"> <span id="rep">0</span></div>
    <div class="day">Смена <b id="served">0 гостей</b></div>
  </div>

  <!-- КОФЕЙНЯ: зал сверху, наше рабочее место снизу — всё на одном экране,
       чтобы кофемашина никогда не пропадала из виду -->
  <section class="screen on" id="s-hall">
    <div class="shopScene"><canvas id="scene"></canvas></div>
    <div class="pad" style="padding-top:10px">
      <div id="pickBox"></div>
      <div class="steps" id="steps"></div>
      <div class="taskLine" id="taskLine"></div>

      <div class="rig" id="rig">
        <svg id="station" viewBox="0 0 900 616" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="crema" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#D9A05B"/><stop offset=".35" stop-color="#B4753C"/>
              <stop offset="1" stop-color="#5C3620"/>
            </linearGradient>
            <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FBF9F4"/><stop offset=".55" stop-color="#E4E0D6"/>
              <stop offset="1" stop-color="#C8C2B4"/>
            </linearGradient>
            <linearGradient id="sage" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#CBE0A4"/><stop offset="1" stop-color="#A8C97A"/>
            </linearGradient>
            <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#C08A57"/><stop offset="1" stop-color="#8A5A3B"/>
            </linearGradient>
            <linearGradient id="beans2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#7A4A28"/><stop offset="1" stop-color="#4A2C1A"/>
            </linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
              <stop offset=".4" stop-color="#FFFFFF" stop-opacity=".12"/>
              <stop offset="1" stop-color="#FFFFFF" stop-opacity=".4"/>
            </linearGradient>
            <filter id="soft"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".16"/></filter>
          </defs>

          <!-- ================= РАБОЧЕЕ МЕСТО =================
               Рисуем вектором в стиле кофейни, а не фотографией: фотокорпус
               тянул за собой свой фон и выпадал из общей картинки. Здесь
               машина стоит на нашей стойке — то, что бариста видит перед собой. -->
          <g id="scenery">
            <!-- стена в тёплую полоску -->
            <rect x="0" y="0" width="900" height="322" fill="#FAE7BB"/>
            <g fill="#F4D89C">
              <rect x="30" y="0" width="26" height="322"/><rect x="110" y="0" width="14" height="322"/>
              <rect x="190" y="0" width="26" height="322"/><rect x="286" y="0" width="14" height="322"/>
              <rect x="372" y="0" width="26" height="322"/><rect x="470" y="0" width="14" height="322"/>
              <rect x="556" y="0" width="26" height="322"/><rect x="654" y="0" width="14" height="322"/>
              <rect x="738" y="0" width="26" height="322"/><rect x="838" y="0" width="14" height="322"/>
            </g>
            <!-- столешница -->
            <rect x="0" y="316" width="900" height="300" fill="#FAF1EA"/>
            <path d="M0 316h900" stroke="#5C3B28" stroke-width="5"/>
            <rect x="0" y="322" width="900" height="16" fill="#EFE0D5"/>
            <!-- ближний край стойки -->
            <rect x="0" y="566" width="900" height="50" fill="#EADACC"/>
            <path d="M0 566h900" stroke="#5C3B28" stroke-width="4" opacity=".5"/>
          </g>

          <!-- ================= ХОЛОДИЛЬНИК С МОЛОКОМ ================= -->
          <g id="fridge">
            <rect x="712" y="96" width="176" height="212" rx="18" fill="#EFEAE0"
                  stroke="#5C3B28" stroke-width="5"/>
            <rect x="730" y="118" width="140" height="132" rx="10" fill="#CFE7EE"
                  stroke="#5C3B28" stroke-width="4"/>
            <rect x="730" y="118" width="140" height="132" rx="10" fill="url(#glass)"/>
            <!-- пакеты молока за стеклом -->
            <g stroke="#5C3B28" stroke-width="3.4">
              <path d="M746 168h34v72h-34z" fill="#FDFBF6"/><path d="M746 168l17-14 17 14" fill="#FDFBF6"/>
              <path d="M746 196h34" stroke-width="2.6"/>
              <path d="M790 176h34v64h-34z" fill="#F6E2E4"/><path d="M790 176l17-13 17 13" fill="#F6E2E4"/>
              <path d="M790 202h34" stroke-width="2.6"/>
              <circle cx="763" cy="214" r="9" fill="#F2CFC4" stroke-width="2.6"/>
              <circle cx="807" cy="219" r="8" fill="#CBE0A4" stroke-width="2.6"/>
            </g>
            <rect x="730" y="262" width="140" height="30" rx="8" fill="#DCD5C7"
                  stroke="#5C3B28" stroke-width="4"/>
            <rect x="778" y="272" width="44" height="10" rx="5" fill="#F7F4EC"/>
            <text x="800" y="86" text-anchor="middle" class="svgCap">МОЛОКО</text>
          </g>

          <!-- ================= ПОЛКА С КРУЖКАМИ ================= -->
          <g id="mugShelf">
            <rect x="700" y="330" width="196" height="12" rx="6" fill="#C08A57"
                  stroke="#5C3B28" stroke-width="4"/>
            <g stroke="#5C3B28" stroke-width="4">
              <path d="M714 286h44v30a14 14 0 0 1-14 14h-16a14 14 0 0 1-14-14z" fill="#E8A85C"/>
              <path d="M758 294h10a11 11 0 0 1 0 22h-10" fill="none"/>
              <path d="M782 286h44v30a14 14 0 0 1-14 14h-16a14 14 0 0 1-14-14z" fill="#E8B978"/>
              <path d="M826 294h10a11 11 0 0 1 0 22h-10" fill="none"/>
            </g>
          </g>

          <!-- ================= КОФЕМОЛКА ================= -->
          <g id="grinder" style="cursor:pointer">
            <!-- бункер с зерном -->
            <path d="M42 104h132l-18 78H60z" fill="#E9F1F5" stroke="#5C3B28" stroke-width="5"/>
            <path d="M54 128h108l-12 50H66z" fill="url(#beans2)"/>
            <g fill="#3E2418">
              <ellipse cx="80" cy="146" rx="11" ry="7" transform="rotate(-20 80 146)"/>
              <ellipse cx="112" cy="140" rx="11" ry="7" transform="rotate(14 112 140)"/>
              <ellipse cx="132" cy="158" rx="11" ry="7" transform="rotate(-8 132 158)"/>
              <ellipse cx="94" cy="166" rx="11" ry="7" transform="rotate(26 94 166)"/>
            </g>
            <path d="M54 128h108" stroke="#5C3B28" stroke-width="3.4" opacity=".5"/>
            <rect x="36" y="90" width="144" height="20" rx="10" fill="url(#chrome)"
                  stroke="#5C3B28" stroke-width="5"/>

/* Иконки OpenMoji (CC BY-SA 4.0, hfg-gmuend/openmoji) — встроены,

/* =========================================================================
   ИКОНКИ
   Свой набор вместо системных эмодзи: те рисуются шрифтом операционной
   системы и на каждом устройстве выглядят по-своему — рядом с рисованной
   кофейней это читалось как чужеродная вставка. Здесь всё в одном стиле:
   тёплая пастель, толстый коричневый контур, скруглённые формы.
   Каждая иконка — самостоятельный SVG в data-URI, поэтому её можно
   вставить и в <img>, и нарисовать на canvas.
   ========================================================================= */
const INK = '#5C3B28';          // единый цвет контура
function svgIcon(inner, vb){
  const body = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + (vb || '0 0 40 40') +
    '" fill="none" stroke="' + INK + '" stroke-width="2.4" ' +
    'stroke-linejoin="round" stroke-linecap="round">' + inner + '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(body);
}

/* Заготовка чашки: используют почти все напитки, отличается только начинка. */
function cupBase(fill, extra){
  return '<path d="M7 13h20v10a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z" fill="#FDF6EA"/>' +
         (fill || '') +
         '<path d="M7 13h20v10a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z"/>' +
         '<path d="M27 16h3a4.5 4.5 0 0 1 0 9h-3" fill="#FDF6EA"/>' +
         '<path d="M6 34h24" stroke-width="2.8"/>' + (extra || '');
}

const ICON = {
  /* ---------- напитки ---------- */
  coffee: svgIcon(cupBase('<path d="M9 17h16v6a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z" fill="#5A3420"/>')),
  tea: svgIcon(cupBase('<path d="M9 19h16v4a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7z" fill="#A9713F"/>',
       '<path d="M14 7q3-3 0-5M20 7q3-3 0-5" stroke-width="2"/>')),
  milk: svgIcon(cupBase(

function plural(n,a,b,c){
  const m = n % 10, h = n % 100;
  if(m===1 && h!==11) return a;
  if(m>=2 && m<=4 && (h<10||h>=20)) return b;
  return c;
}

function spawnGuest(){
  if(guests.length >= 4) return;
  const keys = Object.keys(DRINKS);
  const drink = keys[Math.floor(Math.random()*keys.length)];
  // сколько добавок просит: чем дороже напиток, тем вероятнее
  const exKeys = Object.keys(EXTRAS);
  const want = [];
  const n = Math.random() < .45 ? 0 : (Math.random() < .75 ? 1 : 2);
  while(want.length < n){
    const k = exKeys[Math.floor(Math.random()*exKeys.length)];
    if(!want.includes(k)) want.push(k);
  }
  const R = a => a[Math.floor(Math.random()*a.length)];
  guests.push({
    id: ++guestSeq,
    name: R(NAMES),
    face: R(FACES),
    drink, extras: want,
    patience: 100,
    // сцена: входит из двери и идёт к стойке
    x: DOOR_X, dir: 1, state: 'walk', sel: false,
    skin: R(SKINS), cloth: R(CLOTHES), hair: R(HAIRS),
    longHair: Math.random() < .45,
  });
  renderHall(); hud();
}

// Зал занимает верхнюю часть экрана, поэтому он приземистый: всё, что ниже, —

function fitScene(){
  if(!sctx) return;
  const box = sceneCv.parentElement.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  sceneW = Math.max(280, Math.floor(box.width));
  sceneScale = sceneW / SW;
  const h = Math.round(SH * sceneScale);
  sceneCv.width = sceneW * dpr;
  sceneCv.height = h * dpr;
  sceneCv.style.height = h + 'px';
  sctx.setTransform(dpr * sceneScale, 0, 0, dpr * sceneScale, 0, 0);
}
addEventListener('resize', fitScene);
document.addEventListener('visibilitychange', () => { if(!document.hidden) sceneLast = 0; });

/* ---------- интерьер ---------- */
function drawRoom(){
  const c = sctx;

  // ---- стена
  const wall = c.createLinearGradient(0, 0, 0, WALL_Y);
  wall.addColorStop(0, '#F8EADA'); wall.addColorStop(1, '#EFD9C2');
  c.fillStyle = wall; c.fillRect(0, 0, SW, WALL_Y);
  c.strokeStyle = 'rgba(201,138,75,.09)'; c.lineWidth = 7;
  for(let x = 8; x < SW; x += 24){ c.beginPath(); c.moveTo(x, 0); c.lineTo(x, WALL_Y); c.stroke(); }

  // ---- пол, доски сходятся к точке схода: так зал кажется глубоким
  c.fillStyle = '#D9B48C'; c.fillRect(0, WALL_Y, SW, SH - WALL_Y);
  c.strokeStyle = 'rgba(120,80,50,.16)'; c.lineWidth = 2;
  for(let i = -3; i < 12; i++){
    const x = i * 44;
    c.beginPath(); c.moveTo(x, WALL_Y); c.lineTo(x - 70, SH); c.stroke();
  }
  [168, 194, 226].forEach(yy => {
    c.strokeStyle = 'rgba(120,80,50,.10)';
    c.beginPath(); c.moveTo(0, yy); c.lineTo(SW, yy); c.stroke();
  });
  c.strokeStyle = '#B98F68'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(0, WALL_Y); c.lineTo(SW, WALL_Y); c.stroke();

  // ---- дверь слева: через неё заходят гости
  c.fillStyle = '#CF9E86'; c.fillRect(0, 0, 78, WALL_Y);
  c.strokeStyle = 'rgba(255,255,255,.3)'; c.lineWidth = 2;
  for(let row = 0; row * 15 < WALL_Y; row++){
    const yy = row * 15;
    c.beginPath(); c.moveTo(0, yy); c.lineTo(78, yy); c.stroke();
    const off = row % 2 ? 0 : 16;
    for(let bx = off; bx < 78; bx += 32){
      c.beginPath(); c.moveTo(bx, yy); c.lineTo(bx, yy + 15); c.stroke();
    }
  }
  c.fillStyle = '#B9835A';
  rr(c, DOOR_X - 28, 34, 56, WALL_Y - 34, 5); c.fill();
  c.fillStyle = '#CFE8F0';
  rr(c, DOOR_X - 21, 42, 42, 58, 4); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(DOOR_X - 17, 92); c.lineTo(DOOR_X + 10, 48); c.stroke();
  c.fillStyle = '#8A5A3B';
  c.beginPath(); c.arc(DOOR_X + 19, 108, 3.2, 0, 6.283); c.fill();
  // колокольчик звенит, пока кто-то входит
  const ring = guests.some(g => g.state === 'walk' && g.x < DOOR_X + 46);
  c.save();
  c.translate(DOOR_X, 28);
  c.rotate(ring ? Math.sin(sceneT / 4) * .34 : 0);
  c.fillStyle = '#E0A867';
  c.beginPath(); c.moveTo(-6, 0); c.quadraticCurveTo(0, -11, 6, 0); c.closePath(); c.fill();
  c.beginPath(); c.arc(0, 2, 2.2, 0, 6.283); c.fill();
  c.restore();

  // ---- окно
  c.fillStyle = '#BFE3F2';
  rr(c, 96, 26, 76, 60, 6); c.fill();
  c.fillStyle = '#A8D8E8';
  c.beginPath(); c.arc(126, 66, 18, 0, 6.283); c.fill();
  c.strokeStyle = '#B9835A'; c.lineWidth = 5; rr(c, 96, 26, 76, 60, 6); c.stroke();
  c.lineWidth = 2.6;
  c.beginPath(); c.moveTo(134, 26); c.lineTo(134, 86);
  c.moveTo(96, 56); c.lineTo(172, 56); c.stroke();

  // ---- меловое меню
  c.fillStyle = '#2E2A26'; rr(c, 194, 22, 104, 60, 5); c.fill();
  c.strokeStyle = '#8A5A3B'; c.lineWidth = 3; rr(c, 194, 22, 104, 60, 5); c.stroke();
  c.fillStyle = '#F8F0E7'; c.font = '800 12px Nunito, sans-serif'; c.textAlign = 'center';
  c.fillText('COFFEE', 246, 40);
  c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 2;
  [52, 62, 72].forEach((yy, i) => {
    c.beginPath(); c.moveTo(204, yy); c.lineTo(204 + [58, 70, 44][i], yy); c.stroke();
  });
  c.strokeStyle = 'rgba(245,200,107,.75)';
  c.beginPath(); c.moveTo(268, 52); c.lineTo(290, 52); c.stroke();

  // ---- полка с чашками
  c.fillStyle = '#B9835A'; c.fillRect(316, 74, 96, 6);
  for(let i = 0; i < 4; i++){
    const x = 322 + i * 23;
    c.fillStyle = ['#FFFBF6','#FFE3E0','#E4F3EC','#FFF1D6'][i];
    rr(c, x, 62, 15, 12, 3); c.fill();
    c.strokeStyle = '#D8C6B4'; c.lineWidth = 1.5; rr(c, x, 62, 15, 12, 3); c.stroke();
  }
  c.fillStyle = '#B9835A'; c.fillRect(316, 108, 96, 6);
  c.fillStyle = '#5A3620';
  [322, 348, 374].forEach(x => { rr(c, x, 90, 20, 18, 3); c.fill(); });

  // ---- подвесные лампы
  [104, 196, 288, 372].forEach((lx, i) => {
    const ly = 14 + (i % 2) * 8;
    c.strokeStyle = '#5A4A3E'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(lx, 0); c.lineTo(lx, ly); c.stroke();
    c.fillStyle = '#3B2A22';
    c.beginPath();
    c.moveTo(lx - 11, ly + 10); c.lineTo(lx + 11, ly + 10);
    c.lineTo(lx + 6, ly); c.lineTo(lx - 6, ly); c.closePath(); c.fill();
    const grd = c.createRadialGradient(lx, ly + 12, 2, lx, ly + 12, 40);
    grd.addColorStop(0, 'rgba(255,214,140,.45)');
    grd.addColorStop(1, 'rgba(255,214,140,0)');

/* Столик: круглая столешница, ножка и стул. Рисуется до людей —
   сидящий гость должен оказаться за столом, а не под ним. */
function drawTable(t){
  const c = sctx, k = t.scale;
  c.save(); c.translate(t.x, t.y); c.scale(k, k);
  c.fillStyle = 'rgba(90,60,40,.15)';
  c.beginPath(); c.ellipse(0, 16, 34, 9, 0, 0, 6.283); c.fill();
  // дальний стул — на нём и сидят
  c.fillStyle = '#96633E';
  rr(c, -12, -46, 24, 34, 5); c.fill();
  c.fillStyle = '#7A5236'; rr(c, -12, -18, 24, 6, 3); c.fill();
  // ножка стола
  c.fillStyle = '#7A5236'; c.fillRect(-5, -6, 10, 20);
  c.fillStyle = '#5A3620'; rr(c, -17, 11, 34, 6, 3); c.fill();
  c.restore();
}

/* Столешница и ближний стул — верхний слой: сидящий уходит за них по пояс. */
function drawTableTop(t){
  const c = sctx, k = t.scale;
  c.save(); c.translate(t.x, t.y); c.scale(k, k);
  c.fillStyle = '#8A5A3B';
  c.beginPath(); c.ellipse(0, -3, 32, 11, 0, 0, 6.283); c.fill();
  c.fillStyle = '#BC8558';
  c.beginPath(); c.ellipse(0, -7, 32, 11, 0, 0, 6.283); c.fill();
  c.strokeStyle = 'rgba(90,60,40,.22)'; c.lineWidth = 1.2;
  c.beginPath(); c.ellipse(0, -7, 32, 11, 0, 0, 6.283); c.stroke();
  // ближний стул — спинкой к нам, задаёт глубину
  c.fillStyle = '#8A5A3B';
  rr(c, -13, 0, 26, 10, 4); c.fill();
  c.restore();
  if(t.busy) drawTableCup(t);
}

/* Чашка на столе — у того, кому уже подали. */
function drawTableCup(t){
  const c = sctx, k = t.scale;
  c.save(); c.translate(t.x + 12 * k, t.y - 8 * k); c.scale(k, k);
  c.fillStyle = '#FFFBF6'; rr(c, -6, -9, 12, 10, 2.5); c.fill();
  c.strokeStyle = '#D8C6B4'; c.lineWidth = 1.4; rr(c, -6, -9, 12, 10, 2.5); c.stroke();
  c.fillStyle = '#6B4326';
  c.beginPath(); c.ellipse(0, -8, 4.6, 1.8, 0, 0, 6.283); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.4; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(0, -12); c.quadraticCurveTo(3 + Math.sin(sceneT / 22) * 1.5, -17, 0, -22);
  c.stroke();
  c.restore();
}

/* Сидящий гость: голова, плечи, рука к чашке. Отдельно от ходячего —
   у сидящего нет ног, зато есть стол, за который он частично уходит. */
function drawSeated(g){
  const t = TABLES[g.table];
  if(!t) return;
  const c = sctx, k = t.scale;
  const sip = Math.sin(sceneT / 30 + g.id) > .82;   // изредка подносит чашку

  c.save(); c.translate(t.x - 1 * k, t.y - 20 * k); c.scale(k, k);
  // торс
  c.fillStyle = g.cloth;
  rr(c, -13, -14, 26, 24, 9); c.fill();
  // рука к столу
  c.strokeStyle = g.skin; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(10, -6); c.lineTo(15, sip ? -14 : -4); c.stroke();
  // голова
  c.fillStyle = g.skin;
  c.beginPath(); c.arc(0, -24, 11, 0, 6.283); c.fill();
  // волосы
  c.fillStyle = g.hair;
  c.beginPath(); c.arc(0, -26, 11.4, Math.PI, 0); c.fill();
  if(g.longHair){ rr(c, -12, -26, 5, 16, 2.5); c.fill(); rr(c, 7, -26, 5, 16, 2.5); c.fill(); }
  // довольное лицо
  c.fillStyle = '#3B2A22';
  c.beginPath(); c.arc(-3.6, -24, 1.4, 0, 6.283); c.fill();
  c.beginPath(); c.arc(3.6, -24, 1.4, 0, 6.283); c.fill();
  c.strokeStyle = '#3B2A22'; c.lineWidth = 1.4;
  c.beginPath(); c.arc(0, -21, 3.4, .2, Math.PI - .2); c.stroke();
  c.restore();
}

/* Наш прилавок — ближний край кадра. Рисуется поверх людей:
   так очередь оказывается по ту сторону стойки, а мы — за ней. */
function drawBar(){
  const c = sctx;
  const g = c.createLinearGradient(0, BAR_Y, 0, SH);
  g.addColorStop(0, '#A6714A'); g.addColorStop(.18, '#8A5A3B'); g.addColorStop(1, '#6B4326');
  c.fillStyle = g; c.fillRect(0, BAR_Y, SW, SH - BAR_Y);
  c.fillStyle = 'rgba(255,255,255,.16)'; c.fillRect(0, BAR_Y, SW, 4);
  c.strokeStyle = 'rgba(0,0,0,.13)'; c.lineWidth = 2;
  for(let x = 52; x < SW; x += 52){
    c.beginPath(); c.moveTo(x, BAR_Y + 6); c.lineTo(x, SH); c.stroke();
  }
  // мелочи на стойке: салфетки и сахар
  c.fillStyle = '#F8F0E7'; rr(c, 14, BAR_Y - 9, 22, 11, 2); c.fill();
  c.fillStyle = '#E4CBAA'; rr(c, 44, BAR_Y - 12, 14, 14, 3); c.fill();
}

/* ---------- персонаж ---------- */
function drawPerson(g){
  const c = sctx;
  const walking = g.state === 'walk' || g.state === 'leave';
  const ph = walking ? Math.sin(sceneT / 4.5 + g.id) : 0;   // фаза шага
  const bob = walking ? Math.abs(Math.sin(sceneT / 4.5 + g.id)) * 2 : 0;

  const x = g.x, y = FLOOR_Y + 6 - bob;
  c.save();
  c.translate(x, y);
  if(g.dir < 0) c.scale(-1, 1);

  // тень
  c.setTransform(sctx.getTransform());
  c.fillStyle = 'rgba(90,60,40,.16)';
  c.beginPath(); c.ellipse(0, 2, 15, 4.5, 0, 0, 6.283); c.fill();

  // ноги
  c.strokeStyle = '#4A3E52'; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-4, -22); c.lineTo(-4 + ph * 6, 0); c.stroke();
  c.beginPath(); c.moveTo(4, -22); c.lineTo(4 - ph * 6, 0); c.stroke();

  // туловище
  c.fillStyle = g.cloth;
  rr(c, -11, -50, 22, 30, 8); c.fill();

  // руки
  c.strokeStyle = g.cloth; c.lineWidth = 5;
  c.beginPath(); c.moveTo(-10, -44); c.lineTo(-14 - ph * 4, -28); c.stroke();
  c.beginPath(); c.moveTo(10, -44); c.lineTo(14 + ph * 4, -28); c.stroke();
  // кисти
  c.fillStyle = g.skin;
  c.beginPath(); c.arc(-14 - ph * 4, -27, 3, 0, 6.283); c.fill();
  c.beginPath(); c.arc(14 + ph * 4, -27, 3, 0, 6.283); c.fill();

  // шея и голова
  c.fillStyle = g.skin;
  c.beginPath(); c.arc(0, -60, 11, 0, 6.283); c.fill();

  // волосы
  c.fillStyle = g.hair;
  c.beginPath();
  c.arc(0, -62, 11.5, Math.PI, 0);
  c.lineTo(11.5, -60);
  c.quadraticCurveTo(6, -66, 0, -65);
  c.quadraticCurveTo(-6, -66, -11.5, -60);
  c.closePath(); c.fill();
  if(g.longHair){
    c.beginPath(); c.ellipse(-9, -56, 5, 11, .2, 0, 6.283); c.fill();
    c.beginPath(); c.ellipse(9, -56, 5, 11, -.2, 0, 6.283); c.fill();
  }

  // лицо
  c.fillStyle = '#3B2A22';
  const blink = (Math.floor(sceneT / 90) + g.id) % 7 === 0 && (sceneT % 90) < 6;
  if(blink){
    c.fillRect(-6, -61, 4, 1.6); c.fillRect(2.5, -61, 4, 1.6);
  } else {
    c.beginPath(); c.arc(-4, -61, 1.8, 0, 6.283); c.fill();
    c.beginPath(); c.arc(4.5, -61, 1.8, 0, 6.283); c.fill();
  }
  // румянец
  c.fillStyle = 'rgba(232,128,127,.32)';
  c.beginPath(); c.arc(-7.5, -56, 3, 0, 6.283); c.fill();
  c.beginPath(); c.arc(8, -56, 3, 0, 6.283); c.fill();
  // рот — улыбка тем шире, чем больше терпения
  c.strokeStyle = '#3B2A22'; c.lineWidth = 1.6;
  c.beginPath();
  if(g.patience > 45) c.arc(0.5, -56, 4, .35, Math.PI - .35);
  else if(g.patience > 20){ c.moveTo(-3, -54); c.lineTo(4, -54); }
  else c.arc(0.5, -51, 4, Math.PI + .5, -.5);
  c.stroke();

  c.restore();
}

/* пузырь с заказом над головой */
function drawBubble(g){
  const c = sctx;
  const d = DRINKS[g.drink];
  const w = 34 + g.extras.length * 17, h = 26;
  // Макушка персонажа — на FLOOR_Y-65. Пузырь с хвостиком и полоской терпения
  // занимает h+16 px, поэтому ставим его так, чтобы низ был выше макушки.
  const x = g.x - w / 2, y = FLOOR_Y - 128 - (g.sel ? 4 : 0);

  c.fillStyle = g.sel ? '#FFF3E0' : '#FFFBF6';
  c.strokeStyle = g.sel ? '#C98A4B' : '#E4D3C2';
  c.lineWidth = g.sel ? 3 : 2;
  rr(c, x, y, w, h, 9); c.fill(); c.stroke();
  c.beginPath();
  c.moveTo(g.x - 5, y + h); c.lineTo(g.x, y + h + 7); c.lineTo(g.x + 5, y + h);
  c.closePath(); c.fill();

  // Иконки OpenMoji: рисованные, с контуром — читаются лучше системных эмодзи,
  // которые на разных устройствах выглядят по-разному.
  const di = IMGS[d.ic];
  if(di && di.complete && di.naturalWidth) c.drawImage(di, x + 6, y + 4, 18, 18);
  else { c.font = '15px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
         c.fillText(d.em, x + 8, y + h/2); c.textBaseline = 'alphabetic'; }
  g.extras.forEach((k, i) => {
    c.globalAlpha = (S.stock[k] || 0) > 0 ? 1 : .35;
    const ei = IMGS[EXTRAS[k].ic];
    if(ei && ei.complete && ei.naturalWidth) c.drawImage(ei, x + 26 + i * 17, y + 5, 16, 16);
    c.globalAlpha = 1;
  });

  // полоска терпения под пузырём
  const pw = w - 10;
  c.fillStyle = '#EADCCB';
  rr(c, x + 5, y + h + 9, pw, 4, 2); c.fill();
  c.fillStyle = g.patience > 60 ? '#5CB87F' : g.patience > 30 ? '#F5C86B' : '#E27373';
  rr(c, x + 5, y + h + 9, pw * g.patience / 100, 4, 2); c.fill();
}

function rr(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* ---------- цикл сцены ---------- */
let sceneLast = 0;
function sceneStep(){
  if(!sctx){ return; }

  // Шаг по реальному времени: браузер останавливает rAF в скрытой вкладке,
  // и привязка к кадрам оставила бы гостей стоять в дверях, пока таймер
  // терпения тикает. Ограничиваем dt, чтобы после долгого перерыва
  // никто не «телепортировался» через весь зал.
  const now = performance.now();
  const dt = Math.min(.5, sceneLast ? (now - sceneLast) / 1000 : .016);
  sceneLast = now;
  sceneT += dt * 60;

  const WALK = 80, SLOW = 66, OUT = 96;   // пикселей в секунду

  leaving.forEach(g => { g.x -= OUT * dt; g.dir = -1; });
  leaving = leaving.filter(g => g.x > DOOR_X - 40);

  // те, кому уже подали: идут к столику, пьют и только потом уходят
  seated.forEach(g => {
    const t = TABLES[g.table];
    if(g.state === 'toTable'){
      const tx = t ? t.x : DOOR_X;
      g.dir = g.x < tx ? 1 : -1;
      g.x += Math.sign(tx - g.x) * SLOW * dt;
      if(Math.abs(g.x - tx) < 3){ g.x = tx; g.state = 'sit'; }
    } else if(g.state === 'sit'){
      g.sitT -= dt;
      if(g.sitT <= 0){
        g.state = 'leave';
        if(t) t.busy = null;
        leaving.push(g);
      }
    }
  });
  seated = seated.filter(g => g.state !== 'leave');

  guests.forEach((g, i) => {
    const slot = QUEUE_X[Math.min(i, QUEUE_X.length - 1)];
    if(g.state === 'walk'){
      g.dir = 1;
      g.x += WALK * dt;
      if(g.x >= slot){ g.x = slot; g.state = 'queue'; }
    } else if(g.state === 'queue'){
      // подтягиваемся, когда впереди освободилось место
      if(g.x < slot - 1){ g.x += SLOW * dt; g.dir = 1; }
      else if(g.x > slot + 1){ g.x -= SLOW * dt; g.dir = -1; }
      else g.dir = 1;
    } else if(g.state === 'leave'){
      g.dir = -1;
      g.x -= OUT * dt;
    }
  });

  sctx.clearRect(0, 0, SW, SH);
  drawRoom();

  // сидящие — в глубине зала, до тех, кто стоит у стойки
  seated.forEach(g => { if(g.state === 'sit') drawSeated(g); else drawPerson(g); });
  TABLES.forEach(drawTableTop);

  // рисуем задних первыми, чтобы передние перекрывали
  const sorted = guests.concat(leaving).sort((a, b) => a.x - b.x);
  sorted.forEach(drawPerson);
  sorted.forEach(g => { if(g.state === 'queue' || g.state === 'walk') drawBubble(g); });

  // стойка — последней: очередь стоит по ту сторону, мы за ней
  drawBar();

  if(!guests.length && !seated.length){
    sctx.fillStyle = 'rgba(248,240,231,.92)';
    sctx.font = '700 12px Nunito, sans-serif';
    sctx.textAlign = 'center';
    sctx.fillText('Пока пусто — гости вот-вот зайдут', SW / 2, SH - 8);
  }

  sceneRAF = requestAnimationFrame(sceneStep);
}

/* клик по гостю на сцене: заказ принимается сразу, без промежуточной карточки —
   лишний шаг «выбрал гостя → нажал Готовить» только замедлял игру */
sceneCv.addEventListener('pointerdown', e => {
  const r = sceneCv.getBoundingClientRect();
  const x = (e.clientX - r.left) / sceneScale;
  const y = (e.clientY - r.top) / sceneScale;
  let hit = null;
  guests.forEach(g => {
    if(Math.abs(g.x - x) < 24 && y > FLOOR_Y - 116 && y < FLOOR_Y + 10) hit = g;
  });
  if(!hit) return;
  if(current && current.id === hit.id) return;
  if(current && B && B.step !== 'grind'){
    toast('Сначала закончите текущий заказ'); return;
  }
  const missing = hit.extras.filter(k => (S.stock[k] || 0) <= 0);
  if(missing.length){
    toast('Нет: ' + missing.map(k => EXTRAS[k].name).join(', ') + '. Выиграйте в мини-играх.');
    go('games'); return;
  }
  guests.forEach(g => g.sel = false);
  hit.sel = true;
  current = hit;
  resetBrew();
  renderMachine();
  document.getElementById('rig').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

/* Чек текущего заказа — узкая полоска между залом и машиной.
   Заменил карточку с кнопкой «Готовить»: гость выбирается тапом по нему в зале,
   а здесь просто видно, что мы сейчас готовим. */
let pickShownId = null;   // что уже нарисовано — чтобы не дёргать DOM зря

function renderPick(){
  const box = document.getElementById('pickBox');
  const g = current;
  // Таймер терпения зовёт перерисовку раз в секунду. Без этой проверки
  // innerHTML переписывался бы каждый раз и анимация появления играла бы заново.
  const id = g ? g.id : (guests.length ? 'wait' : 'empty');
  if(id === pickShownId) return;
  pickShownId = id;

  if(!g){
    box.innerHTML = guests.length
      ? '<div class="hintLine">Нажмите на гостя у стойки — и сразу за машину</div>'
      : '<div class="hintLine">Гости заходят через дверь. Пока никого — сходите в мини-игры за добавками.</div>';
    return;
  }
  const d = DRINKS[g.drink];
  const ex = g.extras.map(k =>
    `<span class="chip have"><img src="${ICON[EXTRAS[k].ic]}" alt="" width="13" height="13" style="vertical-align:-2px;margin-right:3px">${EXTRAS[k].name}</span>`
  ).join('') || '<span class="chip">без добавок</span>';

  box.innerHTML = `<div class="pickCard">
      <img class="face" src="${ICON[g.face]}" alt="">
      <div class="who">
        <div class="nm">${g.name}</div>
        <div class="ord"><img src="${ICON[d.ic]}" alt="" width="15" height="15" style="vertical-align:-3px;margin-right:4px">${d.name} · ${d.price} ₽</div>
        <div class="ex">${ex}</div>
      </div>
    </div>`;
}

/* совместимость: старое имя вызывается из нескольких мест */
function renderHall(){ renderPick(); }

/* терпение тает */
setInterval(() => {
  // Пока вкладка скрыта, сцена не рисуется — значит и терпение замораживаем,
  // иначе игрок вернулся бы к пустому залу не по своей вине.
  if(document.hidden) return;
  let changed = false;
  guests.forEach(g => {
    g.patience -= (current && current.id === g.id) ? .18 : .42;
    changed = true;
  });
  const gone = guests.filter(g => g.patience <= 0);
  if(gone.length){
    // разворачиваем к двери и убираем, когда дойдут — иначе исчезали бы на месте
    gone.forEach(g => { g.state = 'leave'; leaving.push(g); });
    guests = guests.filter(g => g.patience > 0);
    gone.forEach(g => {
      // если ушёл тот, кого мы готовили, машину надо сбросить —
      // иначе на экране остаётся чек несуществующего заказа
      if(current && current.id === g.id){ current = null; resetBrew(); renderMachine(); }
      S.rep = Math.max(0, S.rep - 1);
    });
    toast(gone.length === 1 ? 'Гость ушёл не дождавшись' : 'Гости ушли не дождавшись');
    save();
  }
  if(changed) renderHall();
  hud();
}, 1000);

/* Пара завсегдатаев уже за столиками на старте смены: пустой зал
   выглядит как нерабочая кофейня, а не как утро перед наплывом. */
function seedRegulars(){
  const R = a => a[Math.floor(Math.random()*a.length)];
  [0, 2].forEach(ti => {
    if(Math.random() < .35) return;
    const g = {
      id: ++guestSeq, name: R(NAMES), face: R(FACES),
      skin: R(SKINS), cloth: R(CLOTHES), hair: R(HAIRS),
      longHair: Math.random() < .45,
      x: TABLES[ti].x, dir: 1, state: 'sit', table: ti,
      sitT: 20 + Math.random() * 40, extras: [], patience: 100,
    };
    TABLES[ti].busy = g.id;
    seated.push(g);
  });
}

/* приход гостей */
setInterval(() => { if(Math.random() < .5) spawnGuest(); }, 11000);

/* =========================================================================
   КОФЕМАШИНА
   Шаги повторяют реальный цикл: помол → темпер → фиксация рожка →
   пролив → (для молочных) пар.
   ========================================================================= */
const el = id => document.getElementById(id);

const STEP_LIST = [
  {id:'grind', t:'Насыпать'},
  {id:'tamp',  t:'Утрамбовать'},
  {id:'lock',  t:'Вставить'},
  {id:'brew',  t:'Пролив'},
  {id:'steam', t:'Пар'},
  {id:'serve', t:'Подача'},
];

let B = null;
function resetBrew(){
  // возвращаем машину в исходный вид, иначе следы прошлой чашки остаются
  if(document.getElementById('grounds')){

}
resetBrew();

/* Подпись задачи наверху — чтобы всегда было понятно, что делать руками. */
const TASK = {
  grind: ['Держите палец на кофемолке', 'кофе сыплется в рожок · нужно 18 г'],
  tamp:  ['Тяните темпер вниз', 'прижмите кофе с усилием 15–20 кг'],
  lock:  ['Перетащите рожок в группу', 'подхватите его пальцем и ведите вверх'],
  brew:  ['Держите кнопку пролива на панели', 'отпустите, когда в чашке будет 36 г'],
  steam: ['Крутите вентиль пара', 'грейте молоко до 60–65 °C'],

};

function renderMachine(){
  if(!current){
    el('steps').innerHTML = '';
    el('taskLine').innerHTML = '';
    el('tamperBox').setAttribute('opacity', '0');
    el('tamperBox').style.pointerEvents = 'none';
    el('stepBox').innerHTML =
      '<div class="empty"><img class="big" src="' + ICON.coffee + '" alt="">Машина прогрета. Нажмите на гостя у стойки — заказ появится здесь.</div>';
    el('doneCup').setAttribute('opacity', '0');
    el('doneCup').style.pointerEvents = 'none';
    el('pickupHint').textContent = '';
    return;
  }
  const need = DRINKS[current.drink].steam;
  const list = STEP_LIST.filter(s => s.id !== 'steam' || need);
  const idx = list.findIndex(s => s.id === B.step);
  el('steps').innerHTML = list.map((s,i) =>
    `<div class="stp ${i===idx?'on':(i<idx?'done':'')}">${s.t}</div>`).join('');

  const t = TASK[B.step] || ['',''];
  el('taskLine').innerHTML = t[0] + '<small>' + t[1] + '</small>';

  // подсветка того, чем сейчас работаем
  el('grinder').setAttribute('opacity', B.step === 'grind' ? '1' : '.55');
  el('brewRing').setAttribute('opacity', B.step === 'brew' ? '.95' : '0');
  el('leverHint').setAttribute('opacity', B.step === 'brew' ? '1' : '0');
  el('pf').setAttribute('opacity', (B.step === 'brew' || B.step === 'steam' || B.step === 'serve') ? '.3' : '1');
  const tb = el('tamperBox');
  tb.setAttribute('opacity', B.step === 'tamp' ? '1' : '0');
  tb.style.pointerEvents = B.step === 'tamp' ? 'auto' : 'none';
  el('pf').style.opacity = 1;
  el('leverHint').textContent = B.step === 'brew' ? 'тяни вниз' : '';
  el('dockCap').innerHTML = B.step === 'lock' ? '<b>тащи вверх, в группу</b>' : 'Рожок';

  // готовая чашка живёт только на этапе подачи
  const serving = B.step === 'serve';
  el('doneCup').setAttribute('opacity', serving ? '1' : '0');
  el('doneCup').style.pointerEvents = serving ? 'auto' : 'none';
  el('pickupHint').textContent = serving ? 'ставьте сюда' : '';
  el('pickupGlow').setAttribute('opacity', '0');

  drawStep();
}

function setGauge(bar){
  const f = el('barFill'), v = el('barVal');
  if(!f || !v) return;                       // разметка могла поменяться — не роняем игру
  const pct = Math.max(0, Math.min(1, bar / 15));
  f.setAttribute('width', 77 * pct);
  // стрелка манометра: от -130° при нуле до +130° на пятнадцати барах
  const nd = el('needle');
  if(nd) nd.setAttribute('transform', 'rotate(' + (-130 + pct * 260) + ' 440 104)');
  // зелёный в рабочем окне 8–10 бар, иначе тревожный
  f.setAttribute('fill', bar >= 8 && bar <= 10 ? '#5CB87F' : '#E8807F');
  v.textContent = bar.toFixed(1);
}


/* ---------------- прогрев бойлера ----------------
   Из принципа работы: помпа гонит воду через нагретый бойлер под 9 бар,
   и пока он не вышел на рабочие ~93 °C, эспрессо получится жидким.
   Здесь это фон: бойлер греется сам, но если начать пролив раньше —
   оценка просядет. */
let boilerPct = 0;
(function(){
  let last = performance.now();
  setInterval(() => {
    if(document.hidden) { last = performance.now(); return; }
    const now = performance.now(), dt = (now - last) / 1000;
    last = now;
    boilerPct = Math.min(100, boilerPct + dt * 12);      // полный прогрев ~8 с
    const f = el('boilerFill');
    if(f){
      f.setAttribute('width', 77.7 * boilerPct / 100);
      f.setAttribute('fill', boilerPct >= 95 ? '#5CB87F' : '#F5C86B');
    }
  }, 200);
})();

/* ---------------- 1. НАСЫПАТЬ: держим палец на кофемолке ---------------- */
(function(){
  const g = el('grinder');
  let timer = null, last = 0;
  const PER_SEC = 11.25;

  const start = e => {
    if(B.step !== 'grind' || !current) return;
    e.preventDefault();
    if(timer) return;
    g.classList.add('on');
    el('gFall').setAttribute('height', 26);
    el('gLed').setAttribute('fill', '#F5C86B');
    last = performance.now();
    timer = setInterval(() => {
      const now = performance.now();
      B.dose = Math.min(25, B.dose + PER_SEC * (now - last)/1000);
      last = now;
      const gh = Math.min(30, B.dose * 1.5);
      el('grounds').setAttribute('height', gh);
      el('grounds').setAttribute('y', 55 - gh);
      const d = el('doseTxt'); if(d) d.textContent = B.dose.toFixed(1);
      const bar = el('doseBar'); if(bar) bar.style.width = (B.dose/25*100) + '%';
      if(B.dose >= 25) stop();
    }, 30);
  };
  const stop = () => {
    if(!timer) return;
    clearInterval(timer); timer = null;
    g.classList.remove('on');
    el('gFall').setAttribute('height', 0);
    el('gLed').setAttribute('fill', '#3E4A52');
    if(B.dose < 6){ toast('Ещё чуть-чуть — нужно около 18 г'); return; }
    B.scores.dose = 1 - Math.min(1, Math.abs(B.dose - 18) / 11);
    B.step = 'tamp';
    renderMachine();
  };
  g.addEventListener('pointerdown', start);
  addEventListener('pointerup', stop);
  addEventListener('pointercancel', stop);
})();

/* ---------------- 2. ТЕМПЕР: тянем вниз ---------------- */
(function(){
  const t = el('tamper');
  let y0 = null, force = 0;
  const down = e => {
    if(B.step !== 'tamp') return;
    e.preventDefault();
    y0 = e.clientY; force = 0;
    t.setPointerCapture && t.setPointerCapture(e.pointerId);
  };
  const move = e => {
    if(y0 === null) return;
    const dy = Math.max(0, Math.min(46, e.clientY - y0));
    force = dy / 46 * 30;                     // 0..30 кг
    // 26 единиц SVG — ровно расстояние от подошвы темпера до обода корзины,
    // так что на полном ходу он действительно упирается в кофе, а не висит над ним
    const k = el('station').getBoundingClientRect().width / 900;
    t.style.transform = 'translateY(' + (dy / 46 * 26) * k + 'px)';
    const bar = el('tampBar'), txt = el('tampTxt');
    if(bar) bar.style.width = (force/30*100) + '%';
    if(txt) txt.textContent = force.toFixed(0);
  };
  const up = () => {
    if(y0 === null) return;
    y0 = null;
    t.style.transform = '';
    if(force < 3){ return; }                  // случайный тап — не считаем
    B.tampQuality = 1 - Math.min(1, Math.abs(force - 17.5) / 20);
    B.scores.tamp = B.tampQuality;
    el('grounds').setAttribute('fill', '#5E4133');   // утрамбованная таблетка темнее
    const gh = +el('grounds').getAttribute('height') || 0;
    el('grounds').setAttribute('height', gh * .86);  // и просаживается под прессом
    el('grounds').setAttribute('y', 55 - gh * .86);
    B.step = 'lock';
    renderMachine();
  };
  t.addEventListener('pointerdown', down);
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
})();

/* ---------------- 3. РОЖОК: перетаскиваем в группу ---------------- */
(function(){
  const pf = el('pf');
  let drag = false, sx = 0, sy = 0;
  const down = e => {
    if(B.step !== 'lock') return;
    e.preventDefault();
    drag = true; sx = e.clientX; sy = e.clientY;
    pf.classList.add('dragging');
    const ga = document.querySelector('.groupArea');
    ga && ga.classList.add('drop');
    pf.setPointerCapture && pf.setPointerCapture(e.pointerId);
  };
  const move = e => {
    if(!drag) return;
    const k = el('station').getBoundingClientRect().width / 900;   // экран → координаты SVG
    pf.setAttribute('transform', 'translate(' + (e.clientX - sx)/k + ',' + (e.clientY - sy)/k + ')');
  };
  const up = e => {
    if(!drag) return;
    drag = false;
    pf.classList.remove('dragging');
    const area = document.querySelector('.groupArea');
    area && area.classList.remove('drop');
    // попал ли в область группы
    const r = area.getBoundingClientRect();
    const hit = e.clientX > r.left - 40 && e.clientX < r.right + 40 &&
                e.clientY > r.top - 30 && e.clientY < r.bottom;
    pf.removeAttribute('transform');
    if(hit){
      pf.setAttribute('opacity', '.3');
      B.step = 'brew';
      renderMachine();
    } else {
      toast('Ведите рожок к группе — под душ машины');
    }
  };
  pf.addEventListener('pointerdown', down);
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
})();

/* ---------------- 4. РЫЧАГ: тянем вниз, пока льётся ---------------- */
let brewTimer = null;
(function(){
  const lv = el('lever');
  let pulling = false;
  const down = e => {
    if(B.step !== 'brew') return;
    e.preventDefault();
    pulling = true;
    el('brewGlow').setAttribute('opacity', '.9');
    lv.setPointerCapture && lv.setPointerCapture(e.pointerId);
    startBrew();
  };
  const up = () => {
    if(!pulling) return;
    pulling = false;
    el('brewGlow').setAttribute('opacity', '0');
    stopBrew();
  };
  lv.addEventListener('pointerdown', down);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
})();

function startBrew(){
  if(brewTimer) return;
  [...el('stream').children].forEach(i => i.setAttribute('height', 46));
  B.boilerAtStart = boilerPct;
  const resist = (10 - B.grindSize) * .12 + B.tampQuality * .35;
  const rate = 3.6 / Math.max(.55, resist);
  const t0 = performance.now();
  let lastB = t0;
  brewTimer = setInterval(() => {
    const now = performance.now();
    B.brewTime += (now - lastB) / 1000;
    B.yield = Math.min(60, B.yield + rate * (now - lastB) / 1000);
    lastB = now;
    B.pressure = Math.min(11, 3 + resist * 7 + Math.sin(B.brewTime*3) * .25);
    setGauge(B.pressure);
    const bar = el('yieldBar'), txt = el('yieldTxt');
    if(bar) bar.style.width = (B.yield/50*100) + '%';
    if(txt) txt.textContent = B.yield.toFixed(1);
    const fh = Math.min(50, B.yield * 1.35);
    el('cupFill').setAttribute('height', fh);
    el('cupFill').setAttribute('y', 55 - fh);
    if(B.yield > 6) el('station').classList.add('hot');
    if(B.yield >= 60) stopBrew();
  }, 50);
}

function stopBrew(){
  if(!brewTimer) return;
  clearInterval(brewTimer); brewTimer = null;
  [...el('stream').children].forEach(i => i.setAttribute('height', 0));
  setGauge(0);
  if(B.yield < 4) return;              // рычаг дёрнули случайно
  B.scores.yield = 1 - Math.min(1, Math.abs(B.yield - 36) / 26);
  B.scores.time = 1;
  B.step = DRINKS[current.drink].steam ? 'steam' : 'serve';
  renderMachine();
}

/* ---------------- 5. ПАР: крутим вентиль ---------------- */
let steamTimer = null;
(function(){
  const v = el('valve');
  let a0 = null, angle = 0, open = 0;
  const cen = () => { const r = v.getBoundingClientRect();
                      return {x:r.left + r.width/2, y:r.top + r.height/2}; };
  const down = e => {
    if(B.step !== 'steam') return;
    e.preventDefault();
    const c = cen();
    a0 = Math.atan2(e.clientY - c.y, e.clientX - c.x);
    v.setPointerCapture && v.setPointerCapture(e.pointerId);
  };
  const move = e => {
    if(a0 === null) return;
    const c = cen();
    const a = Math.atan2(e.clientY - c.y, e.clientX - c.x);
    let d = a - a0; a0 = a;
    if(d > Math.PI) d -= 2*Math.PI;
    if(d < -Math.PI) d += 2*Math.PI;
    angle += d * 180/Math.PI;
    open = Math.max(0, Math.min(1, angle / 300));
    el('valveMark').setAttribute('transform', 'rotate(' + angle + ' 612 176)');
    if(open > .12) startSteam(); else stopSteamFlow();
  };
  const up = () => { a0 = null; };
  v.addEventListener('pointerdown', down);
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);

  function startSteam(){
    if(steamTimer) return;
    let lastS = performance.now();
    steamTimer = setInterval(() => {
      const now = performance.now(), dt = (now - lastS)/1000;
      lastS = now;
      el('station').classList.add('steaming');
      B.milkTemp += 11.5 * dt * (0.5 + open);
      if(B.milkTemp < 37) B.milkFoam = Math.min(100, B.milkFoam + 25 * dt);
      const tb = el('tempBar'), tt = el('tempTxt'), fb = el('foamBar');
      if(tb) tb.style.width = (B.milkTemp/85*100) + '%';
      if(tt) tt.textContent = B.milkTemp|0;
      if(fb) fb.style.width = B.milkFoam + '%';
      if(B.milkTemp >= 85) finishSteam();
    }, 60);
  }
  function stopSteamFlow(){
    el('station').classList.remove('steaming');
    if(!steamTimer) return;
    clearInterval(steamTimer); steamTimer = null;
    if(B.milkTemp > 30) finishSteam();
  }
  window.__stopSteamFlow = stopSteamFlow;
})();

function finishSteam(){
  if(steamTimer){ clearInterval(steamTimer); steamTimer = null; }
  el('station').classList.remove('steaming');
  if(B.step !== 'steam') return;
  const tempScore = 1 - Math.min(1, Math.abs(B.milkTemp - 62) / 32);
  const foamScore = 1 - Math.min(1, Math.abs(B.milkFoam - 55) / 80);
  B.scores.milk = tempScore * .65 + foamScore * .35;
  B.step = 'serve';
  renderMachine();
}

/* ---------------- промывка группы ---------------- */
el('flushBtn').addEventListener('click', () => {
  if(B.flushed){ toast('Уже промыто'); return; }
  B.flushed = true;
  el('flushBtn').classList.add('done');
  el('flushBtn').lastChild.textContent = 'Группа промыта';
  const w = el('water');
  w.setAttribute('height', 34);
  setTimeout(() => w.setAttribute('height', 0), 700);
  toast('Чисто. Вкус будет лучше');
});

/* Нижняя карточка: шкалы текущего шага и экран подачи. */
/* ---------------- 6. ПОДАЧА: чашку ставим на стойку выдачи ----------------
   Кнопки «Подать гостю» больше нет: готовый напиток берут пальцем
   и переносят в зону выдачи, откуда гость забирает его сам. */
(function(){
  const cup = el('doneCup');
  if(!cup) return;
  let drag = false, sx = 0, sy = 0;
  const down = e => {
    if(!B || B.step !== 'serve') return;
    e.preventDefault();
    drag = true; sx = e.clientX; sy = e.clientY;
    el('pickupGlow').setAttribute('opacity', '1');
    cup.setPointerCapture && cup.setPointerCapture(e.pointerId);
  };
  const move = e => {
    if(!drag) return;
    const k = el('station').getBoundingClientRect().width / 900;
    cup.setAttribute('transform', 'translate(' + (e.clientX - sx)/k + ',' + (e.clientY - sy)/k + ')');
  };
  const up = e => {
    if(!drag) return;
    drag = false;
    const r = el('pickup').getBoundingClientRect();
    const hit = e.clientX > r.left - 30 && e.clientX < r.right + 30 &&
                e.clientY > r.top - 30 && e.clientY < r.bottom + 30;
    cup.removeAttribute('transform');
    el('pickupGlow').setAttribute('opacity', '0');
    if(hit && current){
      finish(evaluate());
    } else {
      toast('Поставьте чашку на стойку выдачи — справа');
    }
  };
  cup.addEventListener('pointerdown', down);
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
})();

      <div class="meter" style="height:16px;margin-top:6px">
        <i id="foamBar" style="width:${B.milkFoam}%;background:var(--mint)"></i>
        <div class="txt" style="font-size:10.5px">пена</div>
      </div>
      <div class="muted" style="font-size:12.5px;margin-top:8px;text-align:center;color:var(--dim)">
        Крутите вентиль по кругу. Верните назад — пар закроется</div>`;
    return;
  }

  if(B.step === 'serve'){
    const r = evaluate();
    box.innerHTML = `
      <div class="verdict">
        <img class="big" src="${ICON[r.face]}" alt="">
        <h3>${r.title}</h3>
        <div class="stars">${starRow(r.stars)}</div>
        <p>${r.notes.join('<br>')}</p>
        <p style="margin-top:10px;color:var(--ink);font-weight:800">
          +${r.pay} ₽${r.tip ? ' · чаевые +' + r.tip + ' ₽' : ''}</p>
      </div>
      <div class="hintLine" style="margin-top:10px">
        Перетащите чашку на стойку выдачи справа — гость заберёт её сам</div>`;
    return;
  }
}

/* ---------- оценка ---------- */
/* Ряд звёзд оценки — картинками, чтобы совпадать по стилю с остальным. */
function starRow(n){
  let out = '';
  for(let i = 0; i < 5; i++)
    out += '<img src="' + (i < n ? ICON.star : ICON.starOff) + '" alt="" width="24" height="24">';
  return out;
}

function evaluate(){
  const sc = B.scores;
  // Пролив весит вдвое: в эспрессо он решает вкус сильнее всего.
  // Раньше в среднее подмешивались всегда-единичные слагаемые, и чашка
  // с 10 г вместо 36 получала четыре звезды.
  const parts = [sc.dose || 0, sc.tamp || 0, (sc.yield || 0) * 2];
  let weight = 4;
  if(sc.milk != null){ parts.push(sc.milk); weight += 1; }
  let avg = parts.reduce((a,b) => a + b, 0) / weight;
  if(B.flushed) avg = Math.min(1, avg + .05);   // промывка — небольшой честный бонус
  if(B.boilerAtStart != null && B.boilerAtStart < 90) avg *= .8;   // холодная машина

  const notes = [];
  if(sc.dose < .6) notes.push(B.dose < 18 ? 'Мало кофе в корзине — вкус пустой' : 'Переполнена корзина');
  if(sc.tamp < .6) notes.push(B.tampQuality < .5 ? 'Темпер неровный — вода нашла канал' : 'Пережали темпер');
  if(B.brewTime < 20) notes.push('Пролив быстрый — кисло, недоэкстракция');
  else if(B.brewTime > 35) notes.push('Пролив долгий — горчит');
  if(B.yield < 28) notes.push('Мало в чашке — концентрат');
  else if(B.yield > 44) notes.push('Перелив — вкус водянистый');
  if(sc.milk != null){
    if(B.milkTemp > 70) notes.push('Молоко перегрето — привкус варёного');
    else if(B.milkTemp < 55) notes.push('Молоко недогрето');
    if(B.milkFoam < 25) notes.push('Пены почти нет');
    else if(B.milkFoam > 80) notes.push('Пена как мыло — слишком много воздуха');
  }
  if(B.boilerAtStart != null && B.boilerAtStart < 90)
    notes.push('Бойлер не прогрелся — экстракция слабая, вкус пустой');
  if(!B.flushed) notes.push('Группу не промыли — привкус вчерашней гущи');
  if(!notes.length) notes.push('Всё по регламенту. Крема плотная, вкус сбалансирован.');

  const stars = Math.max(1, Math.min(5, Math.round(avg * 4.4 + 0.7)));
  const base = DRINKS[current.drink].price;
  const extrasPay = current.extras.length * 25;
  const pay = Math.round(base * (.55 + avg * .45)) + extrasPay;
  const tip = stars >= 4 ? Math.round(base * .15 * (stars - 3)) : 0;

  return {
    stars, pay, tip, notes, avg,
    face: stars >= 5 ? 'vWow' : stars >= 4 ? 'vGood' : stars >= 3 ? 'vOk' : stars >= 2 ? 'vMeh' : 'vBad',
    title: stars >= 5 ? 'Идеально!' : stars >= 4 ? 'Хорошо' : stars >= 3 ? 'Сойдёт' : stars >= 2 ? 'Так себе' : 'Мимо',
  };
}

function finish(r){
  current.extras.forEach(k => { S.stock[k] = Math.max(0, (S.stock[k]||0) - 1); });
  S.money += r.pay + r.tip;
  S.served += 1;
  if(r.stars >= 4) S.rep += 1;
  guests = guests.filter(g => g.id !== current.id);
  // Довольный гость садится за свободный столик и пьёт — зал живёт,
  // а не пустеет сразу после каждой чашки.
  const free = TABLES.findIndex(t => !t.busy);
  if(free >= 0 && r.stars >= 2){
    TABLES[free].busy = current.id;
    current.table = free;
    current.state = 'toTable';
    current.sitT = 18 + Math.random() * 14;
    seated.push(current);
  } else {
    current.state = 'leave';
    leaving.push(current);        // уходит, а не растворяется
  }
  current = null;
  save(); hud(); renderPick();
  toast(`+${r.pay + r.tip} ₽`);
  resetBrew();
  renderMachine();
}

/** Подгоняет холст под ширину окна, сохраняя пропорцию этапа. */
function fit(w, h){
  if(!ctx) return;
  const box = mgCanvas.parentElement.getBoundingClientRect();
  DPR = Math.min(devicePixelRatio || 1, 2);
  VW = Math.max(260, Math.floor(box.width));
  VH = Math.round(VW * h / w);
  const maxH = Math.round(innerHeight * .55);
  if(VH > maxH) VH = maxH;
  mgCanvas.width = VW * DPR;
  mgCanvas.height = VH * DPR;
  mgCanvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* награда за весь путь: чем чище прошли, тем больше добавок */
function journeyReward(score){
  const max = JOURNEY.length * 100;
  const pct = score / max;
  if(pct >= .8) return { marsh:2, syrup:1, cinn:1, cream:1 };
  if(pct >= .55) return { marsh:1, syrup:1, cinn:1 };
  if(pct >= .3) return { marsh:1, cinn:1 };
  return { cinn:1 };
}
