/* ---------- ЭТАП 1: ПЛАНТАЦИЯ ----------
   Без таймера. У каждой ягоды свой цикл: зелёная → спелая → опавшая.
   Снять надо именно спелой. Зелёная дозреет, спелая перезреет и упадёт.
   Этап кончается, когда ветки пусты — все либо собраны, либо опали. */
function harvestGame(){
  const W = 400, H = 300; fit(W, H);
  const k = () => VW / W;
  const self = {};
  let berries = [], picked = 0, early = 0, missed = 0, spawned = 0, spawn = 0;
  const TOTAL = 20;

  function addBerry(){
    berries.push({
      x: 26 + Math.random()*(W-52), y: 46 + Math.random()*(H-96),
      r: 10, state: 'green',
      t: 2.2 + Math.random()*2.4,
      ripeWindow: 6.5 + Math.random()*2.2,
      pop: 0, fall: 0,
    });
    spawned++;
  }
  for(let i = 0; i < 7; i++) addBerry();

  const tap = e => {
    e.preventDefault();
    const r = mgCanvas.getBoundingClientRect();
    const x = ((e.touches?e.touches[0].clientX:e.clientX) - r.left)/k();
    const y = ((e.touches?e.touches[0].clientY:e.clientY) - r.top)/k();
    for(let i = berries.length-1; i >= 0; i--){
      const b = berries[i];
      if(b.state === 'gone' || b.state === 'fallen') continue;
      if(Math.hypot(b.x-x, b.y-y) < b.r + 8){
        if(b.state === 'ripe'){ picked++; b.state = 'gone'; b.pop = 10; }
        else { early++; b.pop = -8; }
        return;
      }
    }
  };
  mgCanvas.addEventListener('pointerdown', tap);
  self.stop = () => mgCanvas.removeEventListener('pointerdown', tap);

  let last = performance.now();
  self.step = function(){
    const now = performance.now(), dt = Math.min(.1, (now-last)/1000); last = now;
    if(spawned < TOTAL){ spawn -= dt; if(spawn <= 0){ addBerry(); spawn = .9 + Math.random()*.9; } }

    let live = 0;
    berries.forEach(b => {
      if(b.pop > 0) b.pop--; else if(b.pop < 0) b.pop++;
      if(b.state === 'gone') return;
      if(b.state === 'fallen'){ b.fall++; return; }
      live++;
      b.t -= dt;
      if(b.t <= 0){
        if(b.state === 'green'){ b.state = 'ripe'; b.t = b.ripeWindow; }
        else { b.state = 'fallen'; missed++; }
      }
    });

    if(spawned >= TOTAL && live === 0){
      const pts = Math.max(0, Math.round(picked/TOTAL*100) - early*4);
      return stageDone(Math.min(100, pts),
        `Собрано спелыми: ${picked} из ${TOTAL}` +
        (early ? `, сорвано зелёных: ${early}` : '') + (missed ? `, опало: ${missed}` : ''));
    }
    draw();
  };

  function draw(){
    const s = k();
    ctx.setTransform(DPR*s,0,0,DPR*s,0,0);
    ctx.fillStyle = '#EAF3E2'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = '#7A9E6B'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for(let i = 0; i < 4; i++){
      const y = 60 + i*62;
      ctx.beginPath(); ctx.moveTo(-10, y);
      ctx.quadraticCurveTo(W/2, y - 18 + (i%2)*36, W+10, y); ctx.stroke();
    }
    ctx.fillStyle = '#8FBE7C';
    for(let i = 0; i < 14; i++){
      const lx = (i*57 + 20) % W, ly = 50 + (i*43) % (H-80);
      ctx.save(); ctx.translate(lx, ly); ctx.rotate(i);
      ctx.beginPath(); ctx.ellipse(0,0,15,7,0,0,6.283); ctx.fill(); ctx.restore();
    }
    berries.forEach(b => {
      if(b.state === 'gone') return;
      let cy = b.y;
      if(b.state === 'fallen') cy = b.y + Math.min(H+30, b.fall*3);
      const rr = b.r + (b.pop>0 ? b.pop*.4 : 0) + (b.pop<0 ? b.pop*.3 : 0);
      let fill, stroke;
      if(b.state === 'green'){ fill = '#8CC152'; stroke = '#6B9C3A'; }
      else if(b.state === 'ripe'){
        const urg = 1 - Math.max(0, Math.min(1, b.t / b.ripeWindow));
        fill = urg > .6 ? '#8E1E1E' : '#C62F2F'; stroke = '#7A1515';
      } else { fill = '#5A2020'; stroke = '#3A1010'; }
      ctx.beginPath(); ctx.arc(b.x, cy, rr, 0, 6.283);
      ctx.fillStyle = fill; ctx.fill();
      ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke();
      if(b.state === 'ripe'){
        ctx.beginPath(); ctx.arc(b.x, cy, rr + 3 + Math.sin(performance.now()/180)*1.5, 0, 6.283);
        ctx.strokeStyle = 'rgba(255,210,90,.6)'; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(b.x - rr*.3, cy - rr*.3, rr*.28, 0, 6.283);
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
    });
    ctx.fillStyle = '#5B6B52'; ctx.font = '700 13px Nunito, sans-serif';
    ctx.textAlign = 'left'; ctx.fillText('Собрано: ' + picked, 12, 22);
    document.getElementById('mgScore').textContent = J.score + '+' + Math.round(picked/TOTAL*100);
  }
  return self;
}

/* ---------- ЭТАП 2: СОРТИРОВКА ---------- */
function sortGame(){
  const W = 400, H = 280; fit(W, H);
  const k = () => VW / W;
  const self = {};
  let beans = [], good = 0, mistakes = 0, spawn = 0, t = 0;
  const t0 = performance.now(), ROUND = 25;
  let left = ROUND;

  const tap = e => {
    e.preventDefault();
    const r = mgCanvas.getBoundingClientRect();
    const x = ((e.touches?e.touches[0].clientX:e.clientX) - r.left)/k();
    const y = ((e.touches?e.touches[0].clientY:e.clientY) - r.top)/k();
    for(let i = beans.length-1; i >= 0; i--){
      const b = beans[i];
      if(Math.hypot(b.x-x, b.y-y) < 20){
        if(b.burnt){ good++; beans.splice(i,1); }
        else { mistakes++; b.shake = 12; }
        return;
      }
    }
  };
  mgCanvas.addEventListener('pointerdown', tap);
  self.stop = () => mgCanvas.removeEventListener('pointerdown', tap);

  self.step = function(){
    t++;
    left = Math.max(0, ROUND - (performance.now()-t0)/1000);
    if(--spawn <= 0){
      spawn = 24;
      beans.push({ x:-20, y: 80 + Math.random()*130, burnt: Math.random() < .4,
                   rot: Math.random()*6, shake: 0 });
    }
    beans.forEach(b => { b.x += 1.6; if(b.shake > 0) b.shake--; });
    beans = beans.filter(b => b.x < W+30);
    if(left <= 0){
      const pts = Math.max(0, good * 7 - mistakes * 8);
      return stageDone(Math.min(100, pts),
        `Убрано брака: ${good}` + (mistakes ? `, задето хороших: ${mistakes}` : ', хорошие не тронуты'));
    }
    draw();
  };

  function draw(){
    const s = k();
    ctx.setTransform(DPR*s,0,0,DPR*s,0,0);
    ctx.fillStyle = '#FBF3E8'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#E8DACB'; ctx.fillRect(0, 60, W, 170);
    ctx.strokeStyle = 'rgba(140,110,90,.22)'; ctx.lineWidth = 3;
    for(let i = 0; i < 12; i++){
      const x = ((i*40 + t*1.6) % (W+40)) - 20;
      ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x-14, 230); ctx.stroke();
    }
    beans.forEach(b => {
      ctx.save();
      ctx.translate(b.x + (b.shake ? Math.sin(b.shake*2)*3 : 0), b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = b.burnt ? '#3A2019' : '#9C6239';
      ctx.beginPath(); ctx.ellipse(0,0,15,10,0,0,6.283); ctx.fill();
      ctx.strokeStyle = b.burnt ? '#241009' : '#7A4A2A'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-11,0); ctx.quadraticCurveTo(0,5,11,0); ctx.stroke();
      ctx.restore();
    });
    ctx.fillStyle = '#8A7266'; ctx.font = '700 13px Nunito, sans-serif';
    ctx.textAlign = 'left'; ctx.fillText('Брак: ' + good + '   ошибок: ' + mistakes, 12, 24);
    ctx.textAlign = 'right';
    ctx.fillStyle = left <= 6 ? '#C62F2F' : '#8A7266';
    ctx.fillText(left.toFixed(0) + ' с', W-12, 24);
    document.getElementById('mgScore').textContent = J.score;
  }
  return self;
}

/* ---------- ЭТАП 3: ОБЖАРКА ----------
   Горелка ходит под барабаном: держишь палец — пламя жарче, зёрна темнеют.
   Слева образец нужного цвета; свою партию надо довести до него и снять.
   Баланс — как с плавным нагревом: перегрел — уголь, недогрел — трава. */
function roastGame(){
  const W = 400, H = 300; fit(W, H);
  const k = () => VW / W;
  const self = {};
  let color = 0;          // 0 сырое … 1 угли
  const TARGET = 0.62, TOL = 0.07;   // нужный цвет и допуск
  let flame = 0, holding = false, done = false, t = 0;
  let last = performance.now();

  const down = e => { e.preventDefault(); if(!done) holding = true; };
  const up = () => {
    if(done) return;
    // отпустить = высыпать зёрна и зафиксировать результат
    done = true; holding = false;
    const d = Math.abs(color - TARGET);
    const pts = Math.max(0, Math.round(100 - Math.max(0, d - TOL) * 480));
    const note = color < TARGET - TOL ? 'Сняли рано — зерно светлое, во вкусе трава и кислота'
               : color > TARGET + TOL ? 'Передержали — тёмный уголь, сплошная горечь'
               : 'Ровно до образца — карамельная корочка, сбалансированный вкус';
    stageDone(pts, note);
  };
  mgCanvas.addEventListener('pointerdown', down);
  addEventListener('pointerup', up);
  self.stop = () => { mgCanvas.removeEventListener('pointerdown', down);
                      removeEventListener('pointerup', up); };

  self.step = function(){
    t++;
    const now = performance.now(), dt = Math.min(.1, (now-last)/1000); last = now;
    if(!done){
      // пламя плавно растёт при удержании и опадает при отпускании
      flame += ((holding ? 1 : 0) - flame) * Math.min(1, dt*6);
      color = Math.min(1, color + flame * 0.11 * dt);
      if(color >= 1){ done = true; return stageDone(0, 'Зёрна сгорели дотла — партия в мусор'); }
    }
    draw();
  };

  function beanColor(c){
    // от бледно-зелёного через коричневый к чёрному
    if(c < .18){ const u=c/.18; return `rgb(${170-u*30},${175-u*40},${120-u*40})`; }
    const u = (c-.18)/.82;
    const r = Math.round(150 - u*135), g = Math.round(110 - u*95), b = Math.round(70 - u*60);
    return `rgb(${r},${g},${b})`;
  }

  function draw(){
    const s = k();
    ctx.setTransform(DPR*s,0,0,DPR*s,0,0);
    ctx.fillStyle = '#241C17'; ctx.fillRect(0,0,W,H);

    // образец цели слева
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '700 11px Nunito, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('НУЖНО', 46, 40);
    ctx.beginPath(); ctx.arc(46, 78, 26, 0, 6.283);
    ctx.fillStyle = beanColor(TARGET); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke();

    // барабан ростера
    ctx.save(); ctx.translate(W/2+30, 120);
    ctx.fillStyle = '#3A2E27';
    ctx.beginPath(); ctx.arc(0,0,76,0,6.283); ctx.fill();
    ctx.strokeStyle = '#6E574A'; ctx.lineWidth = 7; ctx.stroke();
    // сетчатая дверца
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1.5;
    for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(i*16,-70); ctx.lineTo(i*16,70); ctx.stroke(); }
    // зёрна крутятся и темнеют вместе с color
    for(let i = 0; i < 11; i++){
      const a = t*0.03 + i*0.57, rr = 22 + (i%3)*17;
      ctx.save(); ctx.translate(Math.cos(a)*rr, Math.sin(a)*rr*0.85); ctx.rotate(a);
      ctx.fillStyle = beanColor(color);
      ctx.beginPath(); ctx.ellipse(0,0,11,7,0,0,6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-8,0); ctx.quadraticCurveTo(0,3,8,0); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    // горелка снизу
    const fx = W/2+30, fy = 226;
    ctx.fillStyle = '#555'; ctx.fillRect(fx-30, fy+18, 60, 8);
    // язык пламени зависит от flame
    const fh = 12 + flame*40;
    const grd = ctx.createLinearGradient(fx, fy+18, fx, fy+18-fh);
    grd.addColorStop(0, '#F5A623'); grd.addColorStop(.6, '#F5C86B'); grd.addColorStop(1, 'rgba(245,200,107,0)');
    ctx.fillStyle = grd;
    for(let i=-2;i<=2;i++){
      const jitter = Math.sin(t*0.4+i)*3;
      ctx.beginPath();
      ctx.moveTo(fx+i*9-5, fy+18);
      ctx.quadraticCurveTo(fx+i*9+jitter, fy+18-fh, fx+i*9+5, fy+18);
      ctx.fill();
    }
    // синяя сердцевина
    if(flame > .05){
      ctx.fillStyle = 'rgba(120,180,255,'+(flame*.5)+')';
      ctx.beginPath(); ctx.ellipse(fx, fy+14, 10, fh*0.3, 0, 0, 6.283); ctx.fill();
    }

    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '700 12px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(done ? '' : (holding ? 'держите — жарче' : 'отпустите — высыпать'), fx, 268);
    document.getElementById('mgScore').textContent = J.score;
  }
  return self;
}

/* ---------- ЭТАП 4: ПОМОЛ ----------
   Ручная мельница с жерновами (как их придумали в XVII веке): крутишь
   ручку по кругу, зёрна проваливаются между жерновов и дробятся всё мельче.
   Индикатор помола растёт от крупного к пыли — остановиться надо в зоне
   эспрессо. Перекрутишь — сотрёшь в пыль, вкус горчит. */
function grindGame(){
  const W = 400, H = 300; fit(W, H);
  const k = () => VW / W;
  const self = {};
  const TARGET = 0.66, TOL = 0.06;       // зона эспрессо на шкале помола
  let fine = 0;                          // 0 крупно … 1 пыль
  let angle = 0, a0 = null, done = false, t = 0;
  let particles = [];                    // дроблёный кофе, оседает в приёмник
  for(let i = 0; i < 40; i++)
    particles.push({ x: 150+Math.random()*100, y: 235+Math.random()*40, s: 3, settled: false });

  // центр ручки в координатах холста
  const handleCenter = () => {
    const r = mgCanvas.getBoundingClientRect();
    return { x: r.left + 150*k(), y: r.top + 90*k() };
  };

  const down = e => {
    if(done) return;
    e.preventDefault();
    const c = handleCenter();
    a0 = Math.atan2((e.touches?e.touches[0].clientY:e.clientY) - c.y,
                    (e.touches?e.touches[0].clientX:e.clientX) - c.x);
  };
  const move = e => {
    if(a0 === null || done) return;
    e.preventDefault();
    const c = handleCenter();
    const a = Math.atan2((e.touches?e.touches[0].clientY:e.clientY) - c.y,
                         (e.touches?e.touches[0].clientX:e.clientX) - c.x);
    let d = a - a0; a0 = a;
    if(d > Math.PI) d -= 2*Math.PI;
    if(d < -Math.PI) d += 2*Math.PI;
    angle += d;
    fine = Math.min(1, fine + Math.abs(d) * 0.052);      // мельче с каждым оборотом
    // сыплем частицы всё мельче
    if(Math.abs(d) > 0.1){
      const settled = particles.filter(p=>p.settled).length;
      if(settled < 120){
        particles.push({ x: 130+Math.random()*140, y: 232, vy: 0,
          s: Math.max(1.1, 3.4 - fine*2.4), settled: false });
      }
    }
    if(fine >= 1){ done = true; endGrind(); }
  };
  const up = () => { a0 = null; };
  mgCanvas.addEventListener('pointerdown', down);
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  self.stop = () => { mgCanvas.removeEventListener('pointerdown', down);
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); };

  // если игрок прекратил крутить, а помол в зоне — засчитываем через паузу
  let idle = 0;
  function maybeFinish(dt){
    if(done) return;
    if(a0 === null){ idle += dt; } else idle = 0;
    if(idle > 0.9 && fine > 0.12){ done = true; endGrind(); }
  }
  function endGrind(){
    const d = Math.abs(fine - TARGET);
    const pts = Math.max(0, Math.round(100 - Math.max(0, d - TOL) * 430));
    const note = fine < TARGET - TOL ? 'Помол крупноват — вода проскочит, кофе водянистый'
               : fine > TARGET + TOL ? 'Смолото в пыль — забьётся и станет горьким'
               : 'Помол как надо — тонкий, для эспрессо';
    stageDone(pts, note);
  }

  let last = performance.now();
  self.step = function(){
    t++;
    const now = performance.now(), dt = Math.min(.1, (now-last)/1000); last = now;
    maybeFinish(dt);
    particles.forEach(p => {
      if(p.settled) return;
      p.vy = (p.vy||0) + 40*dt; p.y += p.vy*dt;
      if(p.y > 250){ p.y = 250 - Math.random()*10; p.settled = true; }
    });
    draw();
  };

  function draw(){
    const s = k();
    ctx.setTransform(DPR*s,0,0,DPR*s,0,0);
    ctx.fillStyle = '#F3E8D8'; ctx.fillRect(0,0,W,H);

    // корпус мельницы
    ctx.fillStyle = '#8A5A3B';
    ctx.beginPath();
    ctx.moveTo(110,120); ctx.lineTo(190,120); ctx.lineTo(182,235); ctx.lineTo(118,235); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(118,150,64,4);
    // приёмник с молотым кофе
    ctx.fillStyle = '#6E4425'; ctx.fillRect(112,232,76,50);
    // осевший помол — цвет темнеет с тонкостью
    particles.forEach(p => {
      if(!p.settled) return;
      ctx.fillStyle = fine > .5 ? '#3E2A1E' : '#5A3A25';
      ctx.fillRect(p.x, p.y, p.s, p.s);
    });
    // падающие частицы
    particles.forEach(p => { if(p.settled) return;
      ctx.fillStyle = '#4A3229'; ctx.fillRect(p.x, p.y, p.s, p.s); });

    // ось и ручка сверху
    ctx.strokeStyle = '#5A4A3E'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(150,120); ctx.lineTo(150,90); ctx.stroke();
    ctx.save(); ctx.translate(150,90); ctx.rotate(angle);
    ctx.strokeStyle = 'url(#none)';
    ctx.fillStyle = '#B98455';
    ctx.fillRect(-4,-2,44,8);           // рычаг ручки
    ctx.beginPath(); ctx.arc(42,2,9,0,6.283);
    ctx.fillStyle = '#3B2A22'; ctx.fill();   // набалдашник
    ctx.restore();
    ctx.beginPath(); ctx.arc(150,90,7,0,6.283); ctx.fillStyle='#8D99A3'; ctx.fill();

    // шкала помола справа
    const bx = 300, by = 60, bh = 180, bw = 26;
    ctx.fillStyle = '#E4D3C2'; ctx.fillRect(bx,by,bw,bh);
    // зона эспрессо
    ctx.fillStyle = 'rgba(124,197,176,.6)';
    ctx.fillRect(bx, by + bh*(TARGET-TOL), bw, bh*TOL*2);
    // текущий помол
    ctx.fillStyle = fine > TARGET+TOL ? '#E27373' : '#C98A4B';
    ctx.fillRect(bx-4, by + bh*fine - 3, bw+8, 6);
    ctx.fillStyle = '#8A7266'; ctx.font = '700 10px Nunito, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('крупно', bx+bw+6, by+8);
    ctx.fillText('пыль', bx+bw+6, by+bh);
    ctx.textAlign = 'center'; ctx.fillStyle = '#5A3A25'; ctx.font = '700 12px Nunito, sans-serif';
    ctx.fillText(done ? '' : 'крутите ручку', 150, 40);
    document.getElementById('mgScore').textContent = J.score;
  }
  return self;
}

/* ---------- ЭТАП 5: ЛАТТЕ-АРТ ---------- */
function artGame(){
  const W = 400, H = 300; fit(W, H);
  const k = () => VW / W;
  const self = {};
  // контур сердца — точки, которые нужно «пройти» пальцем
  const pts = [];
  for(let i = 0; i <= 40; i++){
    const t = i/40 * Math.PI*2;
    const x = 16*Math.pow(Math.sin(t),3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    pts.push({ x: W/2 + x*5.2, y: 150 - y*5.2, hit:false });
  }
  let drawing = false, trail = [], done = false;

  const at = e => {
    const r = mgCanvas.getBoundingClientRect();
    return { x: ((e.touches?e.touches[0].clientX:e.clientX)-r.left)/k(),
             y: ((e.touches?e.touches[0].clientY:e.clientY)-r.top)/k() };
  };
  const down = e => { e.preventDefault(); if(done) return; drawing = true; trail = []; };
  const move = e => {
    if(!drawing || done) return;
    e.preventDefault();
    const p = at(e);
    trail.push(p);
    pts.forEach(q => { if(!q.hit && Math.hypot(q.x-p.x, q.y-p.y) < 22) q.hit = true; });
  };
  const up = () => {
    if(!drawing || done) return;
    drawing = false; done = true;
    const hit = pts.filter(p => p.hit).length;
    const pct = Math.round(hit / pts.length * 100);
    stageDone(pct,
      pct >= 85 ? 'Ровное сердце — молоко влито идеально'
      : pct >= 55 ? 'Узор угадывается, но края смазаны'
      : 'Рисунок расплылся — пена слишком жидкая');
  };
  mgCanvas.addEventListener('pointerdown', down);
  mgCanvas.addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  self.stop = () => {
    mgCanvas.removeEventListener('pointerdown', down);
    mgCanvas.removeEventListener('pointermove', move);
    removeEventListener('pointerup', up);
  };

  self.step = function(){
    const s = k();
    ctx.setTransform(DPR*s,0,0,DPR*s,0,0);
    ctx.fillStyle = '#F3E5D6'; ctx.fillRect(0,0,W,H);
    // чашка сверху
    ctx.fillStyle = '#FFFBF6';
    ctx.beginPath(); ctx.arc(W/2, 150, 118, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#D8C6B4'; ctx.lineWidth = 8; ctx.stroke();
    ctx.fillStyle = '#B4753C';
    ctx.beginPath(); ctx.arc(W/2, 150, 104, 0, 6.283); ctx.fill();
    // пунктирный контур
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.hit ? 7 : 4.5, 0, 6.283);
      ctx.fillStyle = p.hit ? '#FFFBF6' : 'rgba(255,251,246,.42)';
      ctx.fill();
    });
    // след пальца — «молоко»
    if(trail.length > 1){
      ctx.strokeStyle = '#FFFBF6'; ctx.lineWidth = 13;
      ctx.lineJoin = ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y);
      trail.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.stroke();
    }
    const hit = pts.filter(p => p.hit).length;
    ctx.fillStyle = '#8A7266'; ctx.font = '700 13px Nunito, sans-serif';
    ctx.textAlign = 'left'; ctx.fillText('Пройдено: ' + Math.round(hit/pts.length*100) + '%', 12, 22);
    document.getElementById('mgScore').textContent = J.score;
  };
  return self;
}

/* ---------- ЭТАП 2: СУШКА ----------
   Зёрна на подносе сохнут. Где палец давно не проходил — там сырость,
   пятно темнеет и растёт. Ворошить свайпом: провёл — сырость ушла.
   Проиграл не по таймеру: этап длится 22 секунды, важно не дать плесени
   разрастись. Итог — доля сухой поверхности к концу. */
function dryGame(){
  const W = 400, H = 300; fit(W, H);
  const k = () => VW / W;
  const self = {};
  const COLS = 10, ROWS = 7;
  const cw = W/COLS, ch = (H-40)/ROWS;
  // каждая клетка: 0 сухо … 1 плесень
  const grid = [];
  for(let r = 0; r < ROWS; r++){ grid.push([]); for(let c = 0; c < COLS; c++) grid[r].push(Math.random()*0.15); }
  let t0 = performance.now(), last = t0, done = false;
  const ROUND = 22;
  let trail = [];

  const at = e => {
    const r = mgCanvas.getBoundingClientRect();
    return { x: ((e.touches?e.touches[0].clientX:e.clientX)-r.left)/k(),
             y: ((e.touches?e.touches[0].clientY:e.clientY)-r.top)/k() };
  };
  let drawing = false;
  const down = e => { e.preventDefault(); drawing = true; trail = []; stir(at(e)); };
  const move = e => { if(!drawing) return; e.preventDefault(); const p = at(e); trail.push(p); stir(p); };
  const up = () => { drawing = false; };
  function stir(p){
    const c = Math.floor(p.x/cw), r = Math.floor((p.y-40)/ch);
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const rr=r+dr, cc=c+dc;
      if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS) grid[rr][cc] = Math.max(0, grid[rr][cc]-0.5);
    }
  }
  mgCanvas.addEventListener('pointerdown', down);
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  self.stop = () => { mgCanvas.removeEventListener('pointerdown', down);
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); };

  self.step = function(){
    const now = performance.now(), dt = Math.min(.1,(now-last)/1000); last = now;
    const left = Math.max(0, ROUND - (now-t0)/1000);
    // сырость медленно ползёт вверх и заражает соседей
    for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
      grid[r][c] = Math.min(1, grid[r][c] + dt*0.045);
      if(grid[r][c] > 0.6){
        const ns = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
        ns.forEach(([rr,cc])=>{ if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS) grid[rr][cc]=Math.min(1,grid[rr][cc]+dt*0.06); });
      }
    }
    if(left <= 0 && !done){
      done = true;
      let dry = 0, tot = ROWS*COLS;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c] < 0.4) dry++;
      const pts = Math.round(dry/tot*100);
      return stageDone(pts, pts >= 80 ? 'Партия просохла ровно, без плесени'
        : pts >= 50 ? 'Кое-где отсырело, но основное спасли'
        : 'Плесень пошла по подносу — половина партии в брак');
    }
    draw();
  };

  function draw(){
    const s = k();
    ctx.setTransform(DPR*s,0,0,DPR*s,0,0);
    ctx.fillStyle = '#C9A876'; ctx.fillRect(0,0,W,H);          // деревянный поднос
    ctx.fillStyle = '#B8935F'; ctx.fillRect(0,0,W,40);
    ctx.fillStyle = '#5B4A38'; ctx.font = '700 13px Nunito, sans-serif';
    ctx.textAlign = 'left'; ctx.fillText('Ворошите зёрна', 12, 26);
    const left = Math.max(0, 22 - (performance.now()-t0)/1000);
    ctx.textAlign = 'right'; ctx.fillStyle = left<=5?'#C62F2F':'#5B4A38';
    ctx.fillText(left.toFixed(0)+' с', W-12, 26);
    // клетки зёрен
    for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
      const v = grid[r][c], x = c*cw, y = 40 + r*ch;
      // много мелких зёрнышек, темнеют от сырости
      for(let i = 0; i < 4; i++){
        const bx = x + 4 + (i%2)*cw*0.45 + Math.sin(r+c+i)*3;
        const by = y + 4 + Math.floor(i/2)*ch*0.45;
        const dark = Math.round(150 - v*110);
        ctx.fillStyle = v > .6 ? `rgb(${90-v*40},${110-v*30},${70-v*30})`  // плесневый зеленоватый
                               : `rgb(${dark+40},${dark},${Math.round(dark*0.7)})`;
        ctx.beginPath(); ctx.ellipse(bx, by, 5, 3.4, 0.5, 0, 6.283); ctx.fill();
      }
      // пятно сырости
      if(v > .35){
        ctx.fillStyle = `rgba(60,50,30,${(v-.35)*0.5})`;
        ctx.fillRect(x, y, cw, ch);
      }
    }
    document.getElementById('mgScore').textContent = J.score;
  }
  return self;
}
